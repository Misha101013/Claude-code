<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art&Coffee — кофейня и изостудия в Астане</title>
<meta name="description" content="Art&Coffee — уютная кофейня и творческая студия на ул. Сыганак, 52/2 в Астане. Кофе, выпечка, мастер-классы по рисованию.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23A6592F'/%3E%3Cpath d='M9 12h20l-1.8 16.5A7 7 0 0 1 20.3 35h-.6a7 7 0 0 1-6.9-6.5L9 12z' fill='%23fff'/%3E%3Cpath d='M29 15h2.5a4 4 0 0 1 0 8H29' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF4EA; --paper:#F5E7D6; --line:#E6D3B7; --ink:#2B1B12; --grey:#75655A;
  --coffee:#A6592F; --coffee-deep:#7A3E1D; --coffee-pale:#F2E1C9; --wa:#25D366;
  --r:16px; --pad:clamp(18px,5vw,64px); --max:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--coffee);outline-offset:3px;border-radius:6px}
.inner{max-width:var(--max);margin:0 auto}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.12;color:var(--ink)}
h1{font-size:clamp(32px,5.4vw,58px);font-weight:700;line-height:1.05}
h2{font-size:clamp(24px,3.6vw,40px)}
h3{font-size:clamp(15px,1.7vw,19px)}
.lead{font-size:clamp(15px,1.6vw,18px);color:var(--grey);font-weight:400}
.mono{font-family:'JetBrains Mono',monospace}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--coffee-deep);
  background:var(--coffee-pale);border:1px solid var(--line);padding:6px 13px;border-radius:100px;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--coffee);flex:none}
.dot.shut{background:#C6553F}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;
  border-radius:11px;font-size:15px;font-weight:600;border:1px solid transparent;cursor:pointer;
  transition:.2s ease;white-space:nowrap;font-family:'Inter',sans-serif}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:#1EBE5A;transform:translateY(-1px)}
.btn-blue{background:var(--coffee);color:#fff}
.btn-blue:hover{background:var(--coffee-deep);transform:translateY(-1px)}
.btn-out{border-color:var(--line);color:var(--ink);background:#fff}
.btn-out:hover{border-color:var(--coffee)}
.btn svg{width:18px;height:18px;flex:none}

/* logo */
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;flex:none}
.mark{width:36px;height:36px;flex:none;border-radius:11px;background:var(--coffee);
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(166,89,47,.35)}
.mark svg{width:19px;height:19px}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark .a{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.02em}
.wordmark .a em{color:var(--coffee);font-style:normal}
.wordmark .b{font-size:8.5px;font-weight:600;letter-spacing:.28em;color:var(--grey);margin-top:3px}

/* header */
header{position:sticky;top:0;z-index:60;background:rgba(251,244,234,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--max);margin:0 auto;padding:11px var(--pad);display:flex;align-items:center;gap:16px}
.menu-links{display:flex;gap:22px;font-size:14px;color:var(--grey);font-weight:500}
.menu-links a{position:relative;padding:2px 0}
.menu-links a::after{content:'';position:absolute;left:0;right:100%;bottom:-2px;height:1.5px;background:var(--coffee);transition:right .25s ease}
.menu-links a:hover{color:var(--ink)}
.menu-links a:hover::after{right:0}
.tel{font-weight:700;font-size:15px;letter-spacing:-.01em;font-family:'JetBrains Mono',monospace}
.switches{display:flex;align-items:center;gap:8px}
.langs{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:3px}
.langs button{border:0;background:transparent;color:var(--grey);cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:700;padding:6px 10px;border-radius:100px;transition:.18s;text-transform:uppercase}
.langs button:hover{color:var(--ink)}
.langs button.on{background:#fff;color:var(--coffee-deep);box-shadow:0 1px 3px rgba(43,27,18,.08)}
#burger{display:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  cursor:pointer;place-items:center;flex:none}
#burger svg{width:17px;height:17px}
.drawer{display:none;border-top:1px solid var(--line);background:#fff;padding:8px var(--pad) 16px}
.drawer.open{display:block}
.drawer a{display:block;padding:12px 0;font-size:16px;border-bottom:1px solid var(--line)}
.drawer .tel-m{font-weight:700;font-family:'JetBrains Mono',monospace;border:0}

@media(max-width:1080px){.menu-links{display:none}}
@media(max-width:860px){#burger{display:grid}}
@media(max-width:760px){.tel{display:none}}
@media(max-width:560px){
  .bar{gap:8px;padding-left:16px;padding-right:16px}
  .bar .btn-wa{padding:10px 13px}
  .bar .btn-wa .lbl{display:none}
  .wordmark .b{display:none}
  .langs button{padding:6px 8px;font-size:11px}
}

/* hero */
.hero{padding:clamp(30px,5vw,60px) var(--pad) clamp(38px,6vw,70px);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);align-items:center;position:relative}
.hero h1{margin:16px 0 18px}
.hero .lead{max-width:46ch}
.hero h1 .hl{color:var(--coffee)}
.cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:26px}
.trust{display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,42px);margin-top:32px;padding-top:26px;border-top:1px solid var(--line)}
.trust div span{display:block;font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.02em}
.trust div small{font-size:12.5px;color:var(--grey)}

.hero-art{position:relative;width:min(420px,100%);aspect-ratio:1/1;margin:0 auto}
.hero-art .ring{position:absolute;inset:0;border-radius:50%;background:var(--coffee-pale)}
.hero-art .ring2{position:absolute;inset:12%;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:0 20px 50px rgba(122,62,29,.16)}
.hero-art .cup{width:34%;color:var(--coffee)}
.pulse-wrap{position:absolute;left:-6%;right:-6%;top:50%;transform:translateY(-50%);height:70px;pointer-events:none}
.pulse-line{width:100%;height:100%}
.pulse-path{fill:none;stroke:var(--coffee);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:640;stroke-dashoffset:640;animation:draw 3.2s ease-in-out infinite}
@keyframes draw{
  0%{stroke-dashoffset:640}
  55%{stroke-dashoffset:0}
  100%{stroke-dashoffset:-640}
}
.hero-art .chip{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:9px 13px;font-size:12.5px;font-weight:600;box-shadow:0 10px 24px rgba(43,27,18,.08);
  display:flex;align-items:center;gap:7px}
.hero-art .chip svg{width:15px;height:15px;color:var(--coffee);flex:none}
.hero-art .chip.c1{top:6%;right:2%}
.hero-art .chip.c2{bottom:8%;left:0}
@media(max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .hero-art{order:-1;width:200px;height:200px;aspect-ratio:auto;margin:0 auto 12px}
  .hero-art .chip{display:none}
}

/* strip */
.strip{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip-in{max-width:var(--max);margin:0 auto;padding:20px var(--pad);display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:18px}
.si{display:flex;gap:12px;align-items:flex-start}
.si b{display:block;font-size:14.5px;font-weight:700}
.si p{font-size:13px;color:var(--grey);line-height:1.45}
.ic{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--coffee)}
.ic svg{width:17px;height:17px}

section{padding:clamp(46px,6.5vw,88px) var(--pad)}
.head{max-width:56ch;margin-bottom:clamp(26px,4vw,44px)}
.head h2{margin:12px 0 12px}

/* services */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,2.4vw,26px);background:#fff;transition:.22s ease}
.card:hover{box-shadow:0 10px 28px rgba(43,27,18,.08);transform:translateY(-2px);border-color:#E9CFA3}
.card .chead{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.card .cico{width:38px;height:38px;border-radius:10px;background:var(--coffee-pale);color:var(--coffee-deep);display:grid;place-items:center;flex:none}
.card .cico svg{width:19px;height:19px}
.card ul{list-style:none;display:flex;flex-wrap:wrap;gap:7px}
.card li{font-size:13px;color:var(--grey);background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:5px 11px}

/* locations */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.loc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:.22s ease}
.loc:hover{box-shadow:0 10px 28px rgba(43,27,18,.08)}
.loc-top{padding:clamp(18px,2.4vw,24px);flex:1}
.loc-top h3{margin-bottom:6px}
.loc-top .addr{font-size:14px;color:var(--grey)}
.loc-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip2{font-size:12px;color:var(--grey);background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:4px 11px}
.chip2.star{color:var(--coffee-deep);font-weight:600}
.loc-acts{display:flex;border-top:1px solid var(--line)}
.loc-acts a{flex:1;padding:13px 8px;text-align:center;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.loc-acts a+a{border-left:1px solid var(--line)}
.loc-acts a:hover{background:var(--paper)}
.loc-acts .w{color:#0F8C4B}
.loc-acts svg{width:15px;height:15px;flex:none}
.info-list{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.info-list li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.info-list li b{font-weight:600;color:var(--grey);font-weight:500}
.info-list li span{font-weight:600;text-align:right}

/* reviews */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rev{border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,2.4vw,26px);background:var(--paper)}
.stars{color:var(--coffee-deep);font-size:13px;letter-spacing:2px;margin-bottom:12px}
.rev p{font-size:15px;line-height:1.6}
.rev .who{margin-top:14px;font-size:12.5px;color:var(--grey)}

.contact{background:var(--ink);color:#fff;border-radius:clamp(20px,3vw,30px);padding:clamp(28px,5vw,58px);text-align:center;position:relative;overflow:hidden}
.contact::after{content:'';position:absolute;width:340px;height:340px;right:-90px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(166,89,47,.55),transparent 68%)}
.contact>*{position:relative}
.contact h2{color:#fff;margin-bottom:12px}
.contact p{opacity:.72;max-width:48ch;margin:0 auto 26px;font-weight:400}
.contact .cta{justify-content:center}
.contact .btn-out{background:transparent;border-color:rgba(255,255,255,.28);color:#fff}
.contact .btn-out:hover{border-color:#fff}

footer{border-top:1px solid var(--line);padding:clamp(34px,4.5vw,54px) var(--pad);background:var(--paper)}
.fgrid{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:26px}
.fgrid h4{font-size:13px;font-weight:700;margin-bottom:11px}
.fgrid p,.fgrid a{font-size:13.5px;color:var(--grey);line-height:2}
.fgrid a:hover{color:var(--ink)}
.copy{max-width:var(--max);margin:28px auto 0;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--grey);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

.fab{position:fixed;right:18px;bottom:18px;z-index:70;width:56px;height:56px;border-radius:50%;background:var(--wa);
  display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,211,102,.42);transition:transform .2s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:28px;height:28px}

.note{margin-top:20px;font-size:12.5px;color:var(--grey);border-left:2px solid var(--coffee);padding-left:13px;max-width:66ch;line-height:1.6}
.note b{color:var(--coffee-deep);font-weight:700}

.rise{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rise.in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
  .rise{opacity:1;transform:none}
  .pulse-path{stroke-dashoffset:0;animation:none}
}
</style>
</head>

</header>

</div>

<div class="strip">

  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = t[el.dataset.t];
    if(v!==undefined) el.textContent = v;
  });

  const h1 = document.getElementById('hero-h1');
  if(h1) h1.innerHTML = `${t.hero_h1_a}<span class="hl">${t.hero_h1_b}</span>${t.hero_h1_c}`;

  const hour = astanaHour();
  const openNow = hour>=10 && hour<21;
  document.getElementById('st-text').textContent = openNow ? t.st_open : t.st_shut;
  document.getElementById('st-dot').classList.toggle('shut', !openNow);
  document.getElementById('t1-num').textContent = '35+';

  document.getElementById('sgrid').innerHTML = CATS.map(cat=>`
    <div class="card">
      <div class="chead"><span class="cico">${cat.icon}</span><h3>${t[cat.c]}</h3></div>
      <ul>${cat.items.map(k=>`<li>${t[k]}</li>`).join('')}</ul>
    </div>`).join('');

  document.getElementById('locs').innerHTML = `
    <div class="loc">
      <div class="loc-top">
        <h3>Art&Coffee</h3>
        <div class="addr">ул. Сыганак, 52/2, Есильский район, Астана</div>
        <div class="loc-meta"><span class="chip2 star">${t.t2_num}</span><span class="chip2">${t.t3_num} · ${t.t3_lbl}</span></div>
      </div>
      <div class="loc-acts">
        <a href="${MAP_LINK}" target="_blank" rel="noopener">${t.a_dir}</a>
        <a href="tel:+77782236782">${t.a_call}</a>
        <a class="w" href="https://wa.me/77471053329?text=${encodeURIComponent(WA_TEXT[lang])}" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
    <div class="loc">
      <div class="loc-top">
        <h3>${t.info_h}</h3>
        <ul class="info-list">
          <li><b>${t.info_check}</b><span>${t.info_check_val}</span></li>
          <li><b>${t.info_pay}</b><span>${t.info_pay_val}</span></li>
          <li><b>${t.info_access}</b><span>${t.info_access_val}</span></li>
          <li><b>${t.info_seats}</b><span>${t.info_seats_val}</span></li>
        </ul>
      </div>
    </div>`;

  document.getElementById('revs').innerHTML = [
    [t.r1,t.r1w],[t.r2,t.r2w],[t.r3,t.r3w]
  ].map(([q,w])=>`
    <div class="rev"><div class="stars">★★★★★</div><p>${q}</p><div class="who">${w}</div></div>`).join('');

  const link = 'https://wa.me/77471053329?text=' + encodeURIComponent(WA_TEXT[lang]);
  ['wa-top','wa-hero','wa-cta','wa-fab'].forEach(id=>document.getElementById(id).href = link);
}

document.getElementById('langs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  lang = b.dataset.lang; render();
});

const burger = document.getElementById('burger'), drawer = document.getElementById('drawer');
burger.addEventListener('click', ()=>{
  const open = drawer.classList.toggle('open');
  burger.setAttribute('aria-expanded', open);
});
drawer.addEventListener('click', e=>{
  if(e.target.tagName==='A'){ drawer.classList.remove('open'); burger.setAttribute('aria-expanded','false'); }
});

if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }),{threshold:.12});
  document.querySelectorAll('.rise').forEach(el=>io.observe(el));
}else{
  document.querySelectorAll('.rise').forEach(el=>el.classList.add('in'));
}

document.getElementById('yr').textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
