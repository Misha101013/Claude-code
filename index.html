<style>
:root{
  --bg:#F6F5F1; --paper:#FFFFFF; --line:#E4E1D9; --ink:#14181A; --grey:#5C6360;
  --teal:#0E7C66; --teal-deep:#0A5C4C; --teal-pale:#DCEFE9; --coral:#F2542D;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.inner{max-width:1180px;margin:0 auto;padding:0 clamp(18px,5vw,56px)}
h1,h2,h3{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
h1{font-size:clamp(34px,5.6vw,64px)}
h2{font-size:clamp(24px,3.4vw,38px)}
h3{font-size:16px;font-weight:700}
.mono{font-family:'IBM Plex Mono',monospace}
.lead{font-size:clamp(15px,1.6vw,18px);color:var(--grey);max-width:56ch}

.eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  font-weight:500;color:var(--teal-deep);background:var(--teal-pale);padding:7px 13px;border-radius:7px;letter-spacing:.01em}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;
  border-radius:9px;font-size:15px;font-weight:600;border:1.5px solid transparent;cursor:pointer;
  transition:.2s ease;white-space:nowrap;font-family:'IBM Plex Sans',sans-serif}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid:hover{background:var(--teal-deep);transform:translateY(-1px)}
.btn-out{border-color:var(--line);color:var(--ink);background:var(--paper)}
.btn-out:hover{border-color:var(--teal)}
.btn svg{width:17px;height:17px;flex:none}

/* header */
header{position:sticky;top:0;z-index:60;background:rgba(246,245,241,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:16px clamp(18px,5vw,56px);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.brand .dot-mark{width:9px;height:9px;border-radius:2px;background:var(--teal);flex:none}
.nav-links{display:flex;gap:22px;font-size:14px;color:var(--grey);font-weight:500}
.nav-links a:hover{color:var(--ink)}
@media(max-width:760px){.nav-links{display:none}}
@media(max-width:640px){
  .bar{gap:8px}
  .brand{white-space:nowrap;font-size:13px}
  .langs{padding:2px}
  .langs button{padding:5px 7px;font-size:10.5px}
  #theme-toggle{width:30px;height:30px}
  .bar .btn-solid{padding:10px 12px}
  .bar .btn-solid .lbl{display:none}
}

.switches{display:flex;align-items:center;gap:8px}
.langs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:100px;padding:3px}
.langs button{border:0;background:transparent;color:var(--grey);cursor:pointer;font-family:'IBM Plex Mono',monospace;
  font-size:12px;font-weight:700;padding:6px 10px;border-radius:100px;transition:.18s;text-transform:uppercase}
.langs button:hover{color:var(--ink)}
.langs button.on{background:var(--paper);color:var(--teal-deep);box-shadow:0 1px 3px rgba(20,24,26,.08)}
#theme-toggle{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  cursor:pointer;display:grid;place-items:center;flex:none;color:var(--ink)}
#theme-toggle svg{width:16px;height:16px}
#theme-toggle .moon{display:none}
:root[data-theme="dark"] #theme-toggle .sun{display:none}
:root[data-theme="dark"] #theme-toggle .moon{display:block}
@media(prefers-color-scheme:dark){
  #theme-toggle .sun{display:none}
  #theme-toggle .moon{display:block}
  :root[data-theme="light"] #theme-toggle .sun{display:block}
  :root[data-theme="light"] #theme-toggle .moon{display:none}
}

/* hero */
.hero{padding:clamp(50px,8vw,96px) 0 clamp(40px,6vw,72px)}
.hero h1{margin:18px 0 18px}
.hero h1 .hl{color:var(--teal)}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.stats{display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,48px);margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.stats div span{display:block;font-family:'Manrope',sans-serif;font-size:26px;font-weight:800}
.stats div small{font-size:12.5px;color:var(--grey);font-family:'IBM Plex Mono',monospace}

/* projects */
.section{padding:clamp(50px,7vw,88px) 0}
.section-head{max-width:60ch;margin-bottom:clamp(28px,4vw,44px)}
.section-head h2{margin:14px 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.proj{border:1px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden;
  display:flex;flex-direction:column;transition:.25s ease}
.proj:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(20,24,26,.09);border-color:#CFE7DF}
.proj-shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--ink)}
.proj-shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .4s ease}
.proj:hover .proj-shot img{transform:scale(1.035)}
.proj-chrome{position:absolute;top:0;left:0;right:0;height:26px;background:rgba(20,24,26,.85);
  display:flex;align-items:center;gap:5px;padding:0 10px}
.proj-chrome i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.proj-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.proj-body .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.proj-body p{font-size:14px;color:var(--grey);line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-deep);background:var(--teal-pale);
  border-radius:100px;padding:4px 10px}
.proj-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink)}
.proj-link svg{width:14px;height:14px;transition:transform .2s}
.proj:hover .proj-link svg{transform:translate(2px,-2px)}

.proj.soon{border-style:dashed;background:transparent}
.proj.soon .proj-shot{background:var(--paper);border-bottom:1px dashed var(--line);display:flex;align-items:center;justify-content:center;aspect-ratio:16/10}
.proj.soon .proj-shot svg{width:34px;height:34px;color:var(--line)}
.proj.soon .proj-body h3{color:var(--grey)}
.proj.soon .proj-body p{color:#9BA19D}

/* how i work */
.strip{background:#14181A;border:1px solid rgba(255,255,255,.06);border-radius:20px}
.strip-in{padding:clamp(28px,4vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.si{display:flex;gap:14px;align-items:flex-start}
.si .num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal);flex:none;padding-top:2px}
.si b{display:block;font-size:15px;font-weight:700;color:#fff;margin-bottom:4px}
.si p{font-size:13.5px;color:rgba(255,255,255,.6);line-height:1.5}

/* contact */
.contact{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(32px,5vw,64px);
  text-align:center;position:relative;overflow:hidden}
.contact::after{content:'';position:absolute;width:360px;height:360px;left:50%;top:-140px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(14,124,102,.14),transparent 70%)}
.contact>*{position:relative}
.contact p{color:var(--grey);max-width:50ch;margin:14px auto 28px}
.contact .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

footer{border-top:1px solid var(--line);padding:28px clamp(18px,5vw,56px);display:flex;flex-wrap:wrap;
  gap:12px;justify-content:space-between;font-size:13px;color:var(--grey);font-family:'IBM Plex Mono',monospace}

.rise{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.rise.in{opacity:1;transform:none}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#111412; --paper:#181C1A; --line:#2A2F2C; --ink:#F1F0EC; --grey:#9BA19D;
    --teal:#3FD2AE; --teal-deep:#8FF0D5; --teal-pale:rgba(63,210,174,.12);
  }
  header{background:rgba(17,20,18,.86)}
  .btn-solid{background:var(--teal);color:#0A2620}
  .btn-solid:hover{background:var(--teal-deep)}
}
:root[data-theme="dark"]{
  --bg:#111412; --paper:#181C1A; --line:#2A2F2C; --ink:#F1F0EC; --grey:#9BA19D;
  --teal:#3FD2AE; --teal-deep:#8FF0D5; --teal-pale:rgba(63,210,174,.12);
}
:root[data-theme="dark"] header{background:rgba(17,20,18,.86)}
:root[data-theme="dark"] .btn-solid{background:var(--teal);color:#0A2620}
:root[data-theme="dark"] .btn-solid:hover{background:var(--teal-deep)}
:root[data-theme="light"]{
  --bg:#F6F5F1; --paper:#FFFFFF; --line:#E4E1D9; --ink:#14181A; --grey:#5C6360;
  --teal:#0E7C66; --teal-deep:#0A5C4C; --teal-pale:#DCEFE9;
}
:root[data-theme="light"] header{background:rgba(246,245,241,.88)}
:root[data-theme="light"] .btn-solid{background:var(--ink);color:#fff}
:root[data-theme="light"] .btn-solid:hover{background:var(--teal-deep)}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
  .rise{opacity:1;transform:none}
}
</style>
</head>

let lang = 'ru';

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = t[el.dataset.t];
    if(v!==undefined) el.textContent = v;
  });
  const h1 = document.getElementById('hero-h1');
  if(h1) h1.innerHTML = `${t.hero_h1_a}<span class="hl">${t.hero_h1_b}</span>${t.hero_h1_c}`;
  const openLinks = document.querySelectorAll('.proj-link');
  openLinks.forEach(el=>{
    const key = el.dataset.t;
    const svg = el.querySelector('svg');
    el.textContent = t[key] + ' ';
    if(svg) el.appendChild(svg);
  });
}

document.getElementById('langs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  lang = b.dataset.lang; render();
});

const themeBtn = document.getElementById('theme-toggle');
const storedTheme = localStorage.getItem('theme');
if(storedTheme) document.documentElement.setAttribute('data-theme', storedTheme);
themeBtn.addEventListener('click', ()=>{
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const current = document.documentElement.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
});

if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }),{threshold:.1});
  document.querySelectorAll('.rise').forEach(el=>io.observe(el));
}else{
  document.querySelectorAll('.rise').forEach(el=>el.classList.add('in'));
}

document.getElementById('yr').textContent = new Date().getFullYear();
render();
</script>
