# ===========================================================================
#  Конфигурация парсера заказов на сайты (Казахстан)
#  Скопируйте в config.yaml и правьте под себя. Секреты — в .env, не здесь.
#
#  Формат шаблонов в списках правил:
#    "лендинг"        — обычная фраза, ищется по нормализованному тексту
#                       с учётом границ слов ("сайт" не сработает в "сайтов"?
#                       сработает: окончания слов учитываются как границы)
#    "re:нужен\\s+сайт" — регулярное выражение (Python re, флаг IGNORECASE)
# ===========================================================================

telegram:
  # true — слушаем ВСЕ чаты и каналы аккаунта (рекомендуется).
  listen_all_chats: true
  # Если whitelist непустой, слушаем только его (id или @username).
  chat_whitelist: []
  # Чаты, которые игнорируем всегда.
  chat_blacklist: []
  # Не разбирать личные сообщения (обычно там переписка, а не заказы).
  skip_private: true
  # Не разбирать свои же сообщения.
  skip_outgoing: true

  backfill:
    # Догнать историю чатов при старте — чтобы не ждать новых сообщений.
    enabled: true
    days: 3
    per_chat_limit: 150
    max_chats: 150
    # Пауза между чатами, чтобы не ловить FloodWait.
    delay_seconds: 1.5

  global_search:
    # Поиск по всему Telegram, а не только по вашим чатам.
    enabled: true
    interval_minutes: 45
    limit_per_query: 40
    delay_seconds: 4.0
    queries:
      - "нужен сайт"
      - "нужен лендинг"
      - "ищу разработчика сайта"
      - "нужен интернет магазин"
      - "сделать сайт под ключ"
      - "требуется веб разработчик"
      - "нужен сайт Алматы"
      - "нужен сайт Астана"
      - "разработка сайта бюджет"

# Внешние биржи. Выключены по умолчанию, включаются из бота: /sources on
external:
  enabled: false
  interval_minutes: 20
  sources:
    kwork:
      enabled: true
      # Публичная лента проектов по разделу «Разработка сайтов»
      url: "https://kwork.ru/projects?c=41"
    freelancehunt:
      enabled: true
      url: "https://freelancehunt.com/projects/skill/razrabotka-saytov/85"
    olx_kz:
      enabled: true
      url: "https://www.olx.kz/uslugi/it-kompyutery/q-разработка-сайта/"
    hh_kz:
      enabled: false
      url: "https://api.hh.ru/vacancies?area=40&text=разработка+сайта&per_page=50"

ai:
  # off       — только правила
  # grey_zone — ИИ только для спорных сообщений (рекомендуется, дёшево)
  # all       — ИИ проверяет всё, что прошло минимальный порог
  mode: grey_zone
  model: gemini-3.6-flash
  # Более дешёвая альтернатива для больших потоков: gemini-3.5-flash-lite
  api_base: "https://generativelanguage.googleapis.com/v1beta"
  timeout_seconds: 30
  max_retries: 3
  # Лимит вызовов в сутки — страховка от неожиданного счёта.
  daily_limit: 1500
  # Ниже этой уверенности вердикт ИИ не перевешивает правила.
  min_confidence: 0.55
  # Уровень «размышлений» для Gemini 3.x: none | low | high
  thinking_level: low
  # Кэшировать вердикты по хэшу текста (кросспостинг одного заказа).
  cache: true

scoring:
  # Меньше этого — сразу в мусор, даже без ИИ.
  reject_below: 20
  # Серая зона [ai_low, ai_high) уходит на проверку в Gemini.
  ai_low: 20
  ai_high: 70
  # Итоговый порог отправки лида владельцу.
  notify_threshold: 50
  min_message_length: 20
  max_message_length: 4000

dedup:
  # Один и тот же заказ, разосланный в несколько чатов, = один лид.
  window_hours: 72
  # Максимальное расстояние Хэмминга simhash'ей, при котором тексты считаются
  # одинаковыми (0 — только точные совпадения, 3-6 — похожие переформулировки).
  simhash_distance: 4

rules:
  weights:
    topic: 18          # за каждое тематическое совпадение (сайт, лендинг…)
    intent: 22         # за признак спроса («нужен», «ищу»)
    offer: -30         # за признак предложения услуг («делаем сайты»)
    geo: 12            # за привязку к Казахстану
    budget: 14         # за указанный бюджет
    urgency: 6         # за срочность/сроки
    foreign: -25       # за явно не-казахстанскую географию (когда KZ не найден)
    contact: 4         # за контакт для связи
    question: 5        # за вопросительную форму («кто может сделать?»)
    # Максимум очков, которые можно набрать одной группой
    cap_topic: 26
    cap_intent: 34
    cap_geo: 12
    base: 0

  # ---- Тематика: о чём вообще речь -------------------------------------
  topic:
    - "сайт"
    - "сайта"
    - "сайтов"
    - "вебсайт"
